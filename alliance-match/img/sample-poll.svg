<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif">
  <rect width="300" height="420" rx="18" fill="#1a2a44"/>
  <rect x="14" y="30" width="272" height="370" rx="14" fill="#dbeaf7"/>
  <rect x="14" y="30" width="272" height="34" rx="14" fill="#5c8fd6"/>
  <rect x="14" y="50" width="272" height="14" fill="#5c8fd6"/>
  <text x="150" y="53" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">同盟投票</text>
  <text x="270" y="53" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">✕</text>
  <text x="26" y="88" font-size="12" font-weight="700" fill="#1c2a44">【選択】24日(木)22:30から</text>
  <text x="26" y="104" font-size="10" fill="#1c2a44">ジョイ参加確認アンケート</text>
  <text x="26" y="118" font-size="10" fill="#1c2a44">援軍送り合いは22時までに完了させて下さい</text>
  <rect x="78" y="74" width="120" height="18" rx="4" fill="none" stroke="#e0483a" stroke-width="2"/>
  <g>
    <rect x="152" y="126" width="122" height="22" rx="5" fill="#fff6d6" stroke="#e0483a" stroke-width="1.5"/>
    <text x="213" y="141" text-anchor="middle" font-size="9" fill="#8a3a00">この開催日時を読み取り</text>
    <path d="M198 92 L205 124" stroke="#e0483a" stroke-width="2" marker-end="url(#b)"/>
  </g>
  <defs><marker id="b" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e0483a"/></marker></defs>
  <rect x="24" y="160" width="252" height="150" rx="10" fill="#c9dcf0"/>
  <g font-size="10" fill="#3a4a66">
    <text x="36" y="182">① オンライン参加</text><text x="240" y="182" text-anchor="end">12票</text>
    <rect x="36" y="188" width="204" height="6" rx="3" fill="#a9c2e0"/><rect x="36" y="188" width="180" height="6" rx="3" fill="#3f8de0"/>
    <text x="36" y="222">② オフライン参加</text><text x="240" y="222" text-anchor="end">0票</text>
    <rect x="36" y="228" width="204" height="6" rx="3" fill="#a9c2e0"/>
    <text x="36" y="262">③ 不参加</text><text x="240" y="262" text-anchor="end">1票</text>
    <rect x="36" y="268" width="204" height="6" rx="3" fill="#a9c2e0"/><rect x="36" y="268" width="14" height="6" rx="3" fill="#3f8de0"/>
  </g>
  <rect x="24" y="320" width="252" height="40" rx="10" fill="#c9dcf0"/>
  <text x="150" y="338" text-anchor="middle" font-size="9" fill="#3a4a66">参加人数: 13/76</text>
  <text x="150" y="352" text-anchor="middle" font-size="9" fill="#3a4a66">投票までのカウントダウン: 1d 09:43:11</text>
  <rect x="100" y="370" width="100" height="22" rx="8" fill="#6c7380"/>
  <text x="150" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">投票</text>
  <text x="150" y="408" text-anchor="middle" font-size="9" fill="#c9d6e8">1枚だけ</text>
